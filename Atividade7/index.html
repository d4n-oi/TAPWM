<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções</title>
    <script src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            align-items: center;
            background-color: #fec3c3;
            padding: 20px;
        }
        .container {
            background-color: #e9afaf;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #fb8a8a;
            border-radius: 20px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #fb8a8a;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Insira três números</h2>
        <p></p>
        <input class="form-control" type="number" id="num1" placeholder="Número 1"></br>
        <input class="form-control" type="number" id="num2" placeholder="Número 2"></br>
        <input class="form-control" type="number" id="num3" placeholder="Número 3"></br>
        <button class="btn btn-outline-danger" onclick="RetornaMaior()">Retornar maior</button></br>
        <p id="maior"></p></br>
        <button class="btn btn-outline-danger" onclick="OrdenaCrescente()">Retornar em ordem crescente</button></br>
        <p id="crescente">Crescente</p>
    </div></br>

    <div class="container">
        <h2>Insira uma palavra/frase</h2>
        <p></p>
        <input class="form-control" type="text" id="frase" placeholder="Frase ou Palavra"></br>
        <button class="btn btn-outline-danger" onclick="Palindromo()">Retornar palindromo</button></br>
        <p id="palindromo"></p></br>
    </div></br>
        
    <div class="container">
        <h2>Insira duas palavra</h2>
        <p></p>
        <input class="form-control" type="text" id="palav1" placeholder="Palavra 1"></br>
        <input class="form-control" type="text" id="palav2" placeholder="Palavra 2"></br>
        <button class="btn btn-outline-danger" onclick="Subconjunto()">Retornar Subconjunto</button></br>
        <p id="subconjunto"></p></br>
    </div></br>
        
        
    <div class="container">
        <h2>Insira uma data</h2>
        <p></p>
        <input class="form-control" type="date" id="data"></br>
        <button class="btn btn-outline-danger" onclick="DiaSemana()">Retornar dia da semana</button></br>
        <p id="diasemana"></p></br>
    </div>
        

    </div>
</body>
</html>
