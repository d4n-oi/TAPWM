<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de criar objetos</title>
</head>
<body>
    <script>
        var aluno1 = new Object();
    
        aluno1.ra = "00045678";
        aluno1.nome = "Jão Perera";
        alert(`ra=${aluno1.ra} nome=${aluno1.nome}`);
    
        var aluno2 = {};
        aluno2.ra = "00045679";
        aluno2["nome"] = "Robertinho";
        alert("ra = " + aluno2.ra + " nome = " + aluno2.nome);
        aluno2["email do aluno"] = "Robertinho009@gmiau.com";
        alert(aluno2["email do aluno"]);
    
        var aluno3 = {
            ra: "0008754",
            nome: "Claudin",
        };
        alert("ra = " + aluno3.ra + " nome = " + aluno3.nome);

        function Aluno(ra, nome){
            this.ra = ra;
            this.nome = nome;
            this.MostraDados = function(){
                return "ra = " + this.ra + " nome = " + this.nome;
            }
        }
        var aluno4 = new Aluno("00054328", "Lurenzu");
        alert(aluno4.MostraDados());
        alert(aluno4.nome);

        function Aluno2(){
            var ra;
            var nome;
            this.setRa = function(value){
                this.ra = value;
            }
            this.getRa = function() {
                return this.ra;
            }
            this.setNome = function(value){
                this.nome = value;
            }
            this.getNome = function(){
                return this.nome;
            }
        }
        var aluno6 = new Aluno2();
        aluno6.setNome("Lalala");
        aluno6.setRa("00097543");
        alert("ra = " + aluno6.getRa() + " nome = " + aluno6.getNome());

        function AlunoADS(){
            var numLab;
            this.setNumLab = function(value){
                this.numLab = value;
            }
            this.getnumLab = function(){
                return this.numLab;
            }
        }

        AlunoADS.prototype = new Aluno2();

        var aluno7 = new AlunoADS();
        aluno7.setNome("aaaahh");
        aluno7.setRa("00864");
        aluno7.setNumLab(5);
        alert(`ra=${aluno7.getRa()} nome=${aluno7.getNome()} numLab=${aluno7.getnumLab()}`);

        class Aluno1{
            constructor(){
                this._ra;
                this._nome;
            }
            setNome(value){
                this._nome = value;
            }
            getNome(){
                return this._nome;
            }
            setRa(value){
                this._ra = value;
            }
            getRa(){
                return this._ra;
            }
        }
        var objAluno = new Aluno1();
        objAluno.setNome("Denilce");
        objAluno.setRa("00875432");
        alert(`nome=${objAluno.getNome()} ra=${objAluno.getRa()}`);

        class AlunoADS1 extends Aluno1{
            constructor(){
                super();
                this._numLab;
            }
            setNumLab(value){
                this._numLab = value;
            }
            getnumLab(){
                return this._numLab;
            }
        }
        var objAlunoADS = new AlunoADS1();
        objAlunoADS.setNome("aiai");
        objAlunoADS.setRa("00065313");
        objAlunoADS.setNumLab(6);
        alert(`nome=${objAlunoADS.getNome()} ra=${objAlunoADS.getRa()} numlab=${objAlunoADS.getnumLab()}`);

        var obj1 = new Object();
        var obj2 = obj1;
        obj1.nome = "Atchim";
        alert(obj2.nome);

        class ContaBancaria{
            #cpf;

            constructor(nome, saldoInicial){
                this.nome = nome;
                this.saldo = saldoInicial;
            }

            setCpf(value){
                this.#cpf = value;
            }
            getCpf(){
                return this.#cpf;
            }
            getSaldo(){
                return this.saldo;
            }

            depositar(valor){
                this.saldo += valor;
                this.#registrarTransacao(valor);
            }

            #registrarTransacao(valor){
                console.log(`Depósito de R$ ${valor} realizado pelo ${this.nome} e o Saldo R${this.saldo} para cpf ${this.getCpf()} ou ${this.#cpf}`);
            }
        }

        const conta = new ContaBancaria("AAAHHHH", 298);
        conta.setCpf(123);
        conta.depositar(20);
    </script>
</body>
</html>
