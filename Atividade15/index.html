<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Cursos Fatec Sorocaba</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #b196c4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card-container {
            background: #edc9fe;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h2>Fatec Sorocaba</h2>
        <label for="cursos">Escolha um curso:</label>
        
        <select id="cursos" onchange="verificarCurso(this)">
            <option value="" selected disabled>-- Selecione um cursoooo --</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="logistica">Logística</option>
            <option value="gestao">Gestão Empresarial</option>
            <option value="mecanica">Fabricação Mecânica</option>
        </select>
    </div>

    <script>
        function verificarCurso(selectElement) {
            const valorSelecionado = selectElement.value;
            const nomeCurso = selectElement.options[selectElement.selectedIndex].text;

            if (valorSelecionado !== "") {
                let resposta = confirm("Deseja realmente abrir a janela com informações do curso de " + nomeCurso + "?");
                
                if (resposta) {
                    let novaJanela = window.open("", "_blank", "width=600,height=300");
                    
                    novaJanela.document.write(`
                        <html>
                        <head>
                            <title>${nomeCurso} - Fatec Sorocaba</title>
                            <style>
                                body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }
                                h2 { color: #5a2a82; }
                            </style>
                        </head>
                        <body>
                            <h2>Curso: ${nomeCurso}</h2>
                            <p><strong>Instituição:</strong> Fatec Sorocaba - José Crespo Gonzales</p>
                            <p><strong>Informações:</strong> Este é um curso Superior de Tecnologia gratuito voltado para atender às demandas tecnológicas e industriais da região.</p>
                            <button onclick="window.close()" style="padding: 5px 10px; margin-top: 10px; cursor: pointer;">Fechar Janela</button>
                        </body>
                        </html>
                    `);
                } else {
                    selectElement.value = "";
                }
            }
        }
    </script>

</body>
</html>
