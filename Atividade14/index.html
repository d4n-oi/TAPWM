<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #b196c4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background: #edc9fe;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .radio-group {
            margin-top: 10px;
        }
        .radio-group label {
            font-weight: normal;
            display: inline;
            margin-right: 15px;
        }
        #mensagem {
            margin-top: 10px;
            font-weight: bold;
            color: #007BFF;
        }
        .botoes {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <form id="meuForm">
        <h2>Formulário</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <label for="comentario">Comentário:</label>
        <textarea id="comentario" required></textarea>

        <label>Primeira vez nessa página?</label>
        <div class="radio-group">
            <label><input type="radio" name="primeira" value="sim"> Sim</label>
            <label><input type="radio" name="primeira" value="nao"> Não</label>
        </div>

        <div id="mensagem"></div>

        <div class="botoes">
            <button type="submit" class="btn btn-outline-success">Enviar</button>
            <button type="reset" id="limpar" class="btn btn-light">Limpar</button>
        </div>
    </form>

    <script>
        const radios = document.querySelectorAll('input[name="primeira"]');
        const msg = document.getElementById('mensagem');
        const form = document.getElementById('meuForm');

        radios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'nao') {
                    msg.textContent = "Que bom que voltou!";
                } else {
                    msg.textContent = "Volte sempre a esta página!";
                }
            });
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Formulário enviado com sucesso!');
            form.reset();
            msg.textContent = '';
        });

        document.getElementById('limpar').addEventListener('click', function() {
            msg.textContent = '';
        });
    </script>

</body>
</html>
