<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa Filme</title>
    <script src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <style>
         body {
            font-family: Arial;
            text-align: center;
            background-color: #f5c2c2;
        }

        .container {
            background-color: #e9afaf;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #fb8a8a;
            border-radius: 20px;
        }

        input, select {
            width: 100%;
            margin: 10px 0;
            padding: 8px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pesquisa do Filme</h2>

    <input type="number" id="idade" placeholder="Idade">

    <select id="sexo">
        <option value="masculino">Masculino</option>
        <option value="feminino">Feminino</option>
        <option value="outros">Outros</option>
    </select>

    <select id="opiniao">
        <option value="4">Ótimo</option>
        <option value="3">Bom</option>
        <option value="2">Regular</option>
        <option value="1">Péssimo</option>
    </select>

    <button class="btn btn-outline-danger" onclick="adicionar()">Adicionar</button>
    <button class="btn btn-outline-danger" onclick="calcular()">Calcular</button>

    <p id="resultado"></p>
</div>

</body>
</html>
